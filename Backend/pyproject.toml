[project]
name = "agentic-bi-backend"
version = "0.1.0"
description = "Public retail analytics with Google ADK, Gemini and controlled database tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloud-sql-python-connector[asyncpg]>=1.22.0",
    "duckdb>=1.5.6",
    "fastapi>=0.133,<0.142",
    "uvicorn[standard]>=0.54.0",
    "google-adk>=2.6.1",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-secret-manager>=2.31.0",
    "google-genai>=1.75.0",
    "itsdangerous>=2.2.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "sqlglot>=30.23.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
